name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
          - name: resq-agent
            dir: packages/resq-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ matrix.dir }}
      - run: uv run ruff check src/ tests/
        working-directory: ${{ matrix.dir }}
      - run: uv run ruff format --check src/ tests/
        working-directory: ${{ matrix.dir }}

  typecheck:
    name: Type Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
          - name: resq-agent
            dir: packages/resq-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ matrix.dir }}
      - run: uv run mypy src/
        working-directory: ${{ matrix.dir }}

  docstrings:
    # Public API surface in src/ must carry docstrings. interrogate
    # threshold is configured per-package in [tool.interrogate]
    # in each pyproject.toml; raise the floor over time as gaps
    # are filled.
    name: Docstring Coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
          - name: resq-agent
            dir: packages/resq-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uvx interrogate --config pyproject.toml src/
        working-directory: ${{ matrix.dir }}

  test:
    name: Test (${{ matrix.name }} / ${{ matrix.python-version }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [resq-mcp, resq-dsa, resq-agent]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
            # --cov-fail-under=85 enforces the project threshold here; pyproject's
            # addopts sets it to 0 so local and partial runs don't fail on it.
            cov: --cov=src --cov-report=xml --cov-fail-under=85
          - name: resq-dsa
            dir: packages/resq-dsa
            cov: ""
          - name: resq-agent
            dir: packages/resq-agent
            # addopts sets --cov-fail-under=0 so local and partial runs do not
            # fail on the project threshold; CI is where 85 is enforced.
            cov: --cov=src --cov-report=xml --cov-fail-under=85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ matrix.dir }}
      - run: uv run pytest tests/ -v ${{ matrix.cov }}
        working-directory: ${{ matrix.dir }}

  build:
    name: Build (${{ matrix.name }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: resq-mcp
            dir: packages/resq-mcp
          - name: resq-dsa
            dir: packages/resq-dsa
          - name: resq-agent
            dir: packages/resq-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
        working-directory: ${{ matrix.dir }}

  # Org template/standards conformance (LICENSE, README, no leftover placeholders).
  repo-standards:
    name: Repo standards
    permissions:
      contents: read
    uses: resq-software/.github/.github/workflows/repo-standards.yml@03bd2fc8788be394d96edebcaceb3b3735bb2cbc

  # Single status-check context consumed by the org ruleset default-branch-baseline.
  # Replaces the former placeholder required.yml: now gates on the repo's real CI
  # (lint/typecheck/docstrings/test/build) + repo-standards. Security runs in
  # security.yml (PR + weekly). Aggregates so `required` is green only when all pass.
  # ── Private-name guard ──────────────────────────────────────────────
  # Called from here and not from security.yml: `needs:` cannot reach across
  # workflow files, and the org ruleset watches only the `required` context.
  # A guard that reports into nothing cannot stop a merge, however loudly it
  # fails.
  private-name-guard:
    name: private-name-guard
    # Dependabot's restricted context resolves Actions secrets to empty, so
    # the guard cannot authenticate on its pull requests. The aggregate below
    # tolerates the resulting skip for that actor alone.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/private-name-guard.yml@03bd2fc8788be394d96edebcaceb3b3735bb2cbc # main
    permissions:
      contents: read
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  required:
    name: required
    needs: [lint, typecheck, docstrings, test, build, repo-standards, private-name-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required results
        env:
          RESULTS: ${{ toJSON(needs) }}
          GUARD: ${{ needs.private-name-guard.result }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::error::one or more required jobs failed"; exit 1
          fi
          # The guard is strict: a SKIPPED guard means no check ran, which is
          # also the fork case -- a fork cannot reach PRIVATE_NAME_GUARD_TOKEN,
          # so it fails closed and needs a maintainer to re-run from a branch
          # here. This aggregate is the only context the org ruleset watches,
          # so anything tolerated here is tolerated at merge. Dependabot is the
          # single allowed skip, for the reason given on the job itself.
          case "$ACTOR:$GUARD" in
            "dependabot[bot]:skipped"|*":success") echo "ok: private-name-guard=$GUARD" ;;
            *) echo "::error::private-name-guard returned: $GUARD"; exit 1 ;;
          esac
