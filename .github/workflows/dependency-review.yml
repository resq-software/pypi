#
# Dependency-licence check for pull requests, in warn-only mode. It reports
# any runtime dependency (the action's default scope) that a PR adds under one
# of the licences listed below, in the job summary, without failing the PR; a
# maintainer decides what to do about it.
# Vulnerability gating stays with the org's reusable security scan, which
# security.yml calls; that scan takes no licence inputs, hence this job.
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  licence-check:
    name: licence-check
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","zima"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check dependency licences (warn only)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # warn-only covers denied licences, but the action still fails the step
        # when it cannot resolve a licence to SPDX; keep that advisory too.
        continue-on-error: true
        with:
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          warn-only: true
