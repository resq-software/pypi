#
# Applies the org C-* change-type label (C-Feature / C-Bug / ...) to a PR based
# on its conventional-commit title prefix. Combined with .github/release.yml,
# this makes `gh release create --generate-notes` group PRs by type, which flows
# into the org's changelog aggregator so its feature/fix/kind
# classification is automatic rather than a default guess. Path labels come from
# .github/labeler.yml; this covers the change *type* that paths cannot express.
name: Conventional Title Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- needs write access; guarded by same-repo check
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","zima"]') || 'ubuntu-latest' }}
    steps:
      - name: Map conventional title prefix to a C-* label
        # TITLE is read from env (never interpolated into the script) to avoid
        # zizmor template-injection. The type is the leading token before an
        # optional scope and colon, e.g. `feat(ui)!: ...` -> `feat`.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          type="$(printf '%s' "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')"
          case "$type" in
            feat|feature) label="C-Feature" ;;
            fix)          label="C-Bug" ;;
            perf)         label="C-Performance" ;;
            docs)         label="C-Documentation" ;;
            refactor)     label="C-Refactor" ;;
            test)         label="C-Testing" ;;
            chore|build|ci|style|revert) label="C-Chore" ;;
            *) label="" ;;
          esac

          # Labels currently on the PR: remove only ones actually present (so gh
          # does not error) and only title-derived ones.
          mapfile -t current < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')

          # Labels this workflow owns exclusively. C-Documentation and C-Testing
          # are deliberately excluded: .github/labeler.yml also assigns them from
          # changed paths, so removing them here would fight that path ownership.
          edit_args=()
          for owned in C-Feature C-Bug C-Performance C-Refactor C-Chore; do
            [ "$owned" = "$label" ] && continue
            for have in ${current[@]+"${current[@]}"}; do
              if [ "$have" = "$owned" ]; then
                edit_args+=(--remove-label "$owned")
                break
              fi
            done
          done

          if [ -n "$label" ]; then
            edit_args+=(--add-label "$label")
            echo "Conventional type '$type' -> $label"
          else
            echo "Title has no conventional type prefix; clearing stale type labels only."
          fi

          if [ "${#edit_args[@]}" -eq 0 ]; then
            echo "No label changes needed."
            exit 0
          fi

          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" "${edit_args[@]}" \
            || echo "::warning::label edit failed (labels may need Label Sync); skipped."