#
# Source-of-truth template lives in resq-software/docs:
#   automation/source-repo-templates/api-docs.python.yml
#
# Copy this file to resq-software/pypi at:
#   .github/workflows/api-docs.yml
#
# Renders Markdown API reference for every Python package in the
# monorepo and opens a PR in resq-software/docs with generated
# content under sdks/python/api/.
#
# Pipeline:
#   1. uv pip install -e <each package> + lazydocs
#   2. lazydocs <module>  ->  per-module Markdown files
#   3. Mintlify-safety post-processing (./ prefix on bare links;
#      MDX curly-brace escape outside code regions)
#   4. peter-evans/create-pull-request opens a PR in the docs repo

name: api-docs

on:
  push:
    # pypi monorepo uses single-versioned bare semver tags (v1.3.4,
    # v1.3.3, ...) covering both packages at once, so a single
    # tag pattern is enough.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to document (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Each run force-pushes the same auto/python-api-<ref> branch in
  # the docs repo. Cancel any earlier run still in flight so we do
  # not race on that push.
  group: api-docs-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHON_VERSION: '3.13'
      OUTPUT_DIR: generated-docs
      DOCS_TARGET: sdks/python/api
      # Public packages to document. Format: <pyproject-dir>:<import-name>.
      # The pyproject directory is the path under packages/; the
      # import name is what gets passed to `lazydocs` (typically the
      # underscore form of the distribution name).
      PUBLIC_PACKAGES: >-
        resq-mcp:resq_mcp
        resq-dsa:resq_dsa

    steps:
      - name: Resolve ref metadata
        # Single source of truth for the ref this run documents.
        # workflow_dispatch can pass an alternate ref via inputs.ref;
        # fall back to github.ref_name (already stripped of refs/...).
        # DOCS_REF_SLUG is branch-safe for use in PR/branch names.
        #
        # The ref is routed through env: instead of being inlined via
        # ${{ }}. Inlining at template-expansion time would interpolate
        # the raw string into the shell literal, so a tag name with a
        # single quote (Git allows it) could break out of the quoted
        # context. Env indirection keeps user-controlled data on the
        # variable side of the shell parser, where it cannot escape.
        env:
          REF_RAW: ${{ inputs.ref || github.ref_name }}
        run: |
          raw="$REF_RAW"
          raw="${raw#refs/tags/}"
          raw="${raw#refs/heads/}"
          slug="${raw//\//-}"
          echo "DOCS_REF_NAME=$raw" >> "$GITHUB_ENV"
          echo "DOCS_REF_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # Caching is disabled to close zizmor/cache-poisoning (alert
        # #44). This workflow triggers on `push.tags: 'v*'`, so an
        # actor able to push tags could populate the GitHub Actions
        # cache; later runs across the org could then restore from a
        # poisoned cache. setup-uv@v6 enables caching by default, and
        # the docs generation runs only once per release tag — cache
        # hits don't justify the exposure here.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install packages + lazydocs into a venv
        # lazydocs imports the packages it documents, so they must
        # be installed in the active Python environment. uv pip
        # install -e per package; the editable install resolves all
        # transitive runtime deps the same way `pip install` would.
        run: |
          set -euo pipefail
          uv venv .venv --python "$PYTHON_VERSION"
          # shellcheck disable=SC1091
          source .venv/bin/activate
          for entry in $PUBLIC_PACKAGES; do
            pkg_dir="${entry%%:*}"
            uv pip install -e "packages/$pkg_dir"
          done
          # pydoc-markdown rather than lazydocs: lazydocs uses
          # pkgutil's deprecated find_module(), which Python 3.12
          # removed. Every submodule walk fails with
          #   AttributeError: 'FileFinder' object has no attribute 'find_module'
          # on the runner's Python 3.13. pydoc-markdown is on the
          # find_spec() API and produces Markdown directly.
          uv pip install "pydoc-markdown>=4"

      - name: Generate per-package Markdown
        # `pydoc-markdown -p <pkg>` only documents the top-level
        # module. Earlier we worked around that by listing every
        # submodule in one config so we'd at least get content, but
        # the result was a single mega-file per package — too coarse
        # for the sidebar.
        #
        # Instead: walk the import graph and run pydoc-markdown ONCE
        # PER SUBMODULE, writing the rendered Markdown to a path
        # mirroring the dotted module name. This produces:
        #   <pkg_dir>/overview.md          (the top-level module)
        #   <pkg_dir>/core.md              (resq_mcp.core)
        #   <pkg_dir>/core/config.md       (resq_mcp.core.config)
        #   <pkg_dir>/drone.md             (resq_mcp.drone)
        #   ...
        # which the splice-sdk-nav.py step in the docs repo registers
        # as separate sidebar entries.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .venv/bin/activate
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          missing=0
          generated=0
          for entry in $PUBLIC_PACKAGES; do
            pkg_dir="${entry%%:*}"
            mod_name="${entry##*:}"
            out="$OUTPUT_DIR/$pkg_dir"
            mkdir -p "$out"
            if ! python -c "import ${mod_name}" 2>/dev/null; then
              echo "::error ::cannot import ${mod_name} (entry ${entry})"
              missing=1
              continue
            fi
            # Discover submodules; produce one rendered .md per
            # module name. Filename for the top-level module is
            # `overview.md`; everything else mirrors the dotted name
            # below the package root, with `.` -> `/` so the result
            # matches the import hierarchy.
            python - "$mod_name" "$out" <<'PY'
          import importlib
          import pathlib
          import pkgutil
          import subprocess
          import sys

          top_name, out_dir = sys.argv[1], pathlib.Path(sys.argv[2])
          top = importlib.import_module(top_name)
          modules = [top_name]
          if hasattr(top, "__path__"):
              for info in pkgutil.walk_packages(top.__path__, top_name + "."):
                  if "._" in info.name:
                      continue
                  modules.append(info.name)

          rendered = 0
          for mod in modules:
              if mod == top_name:
                  rel = "overview.md"
              else:
                  rel = mod[len(top_name) + 1:].replace(".", "/") + ".md"
              dest = out_dir / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              # Single-module pydoc-markdown invocation. Inline YAML
              # config; renderer flags match the previous combined
              # config for visual parity.
              cfg = (
                  "loaders:\n"
                  "- type: python\n"
                  f"  modules: ['{mod}']\n"
                  "processors:\n"
                  "- type: filter\n"
                  "  expression: not name.startswith('_') or name == '__init__'\n"
                  "- type: smart\n"
                  "- type: crossref\n"
                  "renderer:\n"
                  "  type: markdown\n"
                  "  render_module_header: true\n"
                  "  descriptive_class_title: true\n"
                  "  add_method_class_prefix: true\n"
              )
              cfg_path = dest.parent / f".{dest.name}.cfg.yml"
              cfg_path.write_text(cfg)
              try:
                  result = subprocess.run(
                      ["pydoc-markdown", str(cfg_path)],
                      capture_output=True, text=True, check=False,
                  )
                  if result.returncode != 0:
                      print(f"::warning ::pydoc-markdown failed for {mod}: {result.stderr.strip()}")
                      continue
                  body = result.stdout.strip()
                  if not body:
                      # Module has no docstrings at all; emit a stub
                      # so the page is reachable from nav.
                      body = f"# {mod}\n\n*No public documentation.*\n"
                  dest.write_text(body, encoding="utf-8")
                  rendered += 1
              finally:
                  cfg_path.unlink(missing_ok=True)
          print(f"rendered {rendered}/{len(modules)} submodules of {top_name}")
          if rendered == 0:
              sys.exit(1)
          PY
            generated=$((generated + 1))
          done
          if [ "$missing" -ne 0 ] || [ "$generated" -eq 0 ]; then
            echo "::error ::aborting to avoid syncing partial/empty docs output"
            exit 1
          fi

      - name: Write top-level index
        # pydoc-markdown emits an overview.md per package. Stitch
        # a small README.mdx at the top of the api/ folder listing
        # the available packages with their pinned versions.
        #
        # Emit .mdx (not .md) because Mintlify's docs.json nav
        # resolver only matches .mdx for page ids; without this,
        # mint dev returns 404 on the registered page.
        #
        # Package names are emitted as plain backticked text rather
        # than hyperlinks because cross-page links from a .mdx
        # parent require nav registration in Mintlify (the bare
        # filename / extensionless-page link form that works in
        # .md parents fails broken-links validation when the parent
        # is .mdx). Users navigate to per-package pages via the
        # URL bar or future programmatic _pages.json nav splice.
        #
        # Package list is sorted alphabetically by directory name
        # so it stays in sync with `_pages.json` (which
        # `find ... | sort` produces below). The version next to
        # each package is read from its pyproject.toml so the
        # rendered docs can be cross-referenced against a specific
        # PyPI release; the workflow ref (`DOCS_REF_NAME`) is shown
        # at the top so tag-triggered runs are clearly identified.
        run: |
          python3 - <<'PY' > "$OUTPUT_DIR/README.mdx"
          import os
          import pathlib
          import re

          ref_name = os.environ.get("DOCS_REF_NAME", "main")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          output_dir = pathlib.Path(os.environ["OUTPUT_DIR"])
          public = (os.environ.get("PUBLIC_PACKAGES") or "").split()

          def read_version(pkg_dir: str) -> str:
              # Best-effort version lookup so a parse failure doesn't
              # break the whole doc build — fall back to "unknown".
              pyproject = pathlib.Path("packages") / pkg_dir / "pyproject.toml"
              if not pyproject.exists():
                  return "unknown"
              text = pyproject.read_text(encoding="utf-8")
              m = re.search(r'^\s*version\s*=\s*"([^"]+)"', text, re.M)
              return m.group(1) if m else "unknown"

          print("# ResQ Python SDK")
          print()
          print(
              f"Auto-generated API reference for "
              f"[`{repo}`](https://github.com/{repo}) "
              f"at ref `{ref_name}`."
          )
          print()
          print("## Packages")
          print()
          entries = sorted(e.split(":", 1)[0] for e in public)
          for pkg_dir in entries:
              if not (output_dir / pkg_dir).is_dir():
                  continue
              version = read_version(pkg_dir)
              print(f"- `{pkg_dir}` — `v{version}`")
          PY

      - name: Prefix bare-filename intra-page links with ./
        # Mintlify rejects bare-filename .md links as broken;
        # prefixing with ./ makes the resolver treat them as
        # relative paths. Same pattern as the TypeScript template.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            sed -E -i \
              's|\]\(([A-Za-z0-9][^)/]*\.md(#[^)]*)?)\)|](./\1)|g' \
              "$f"
          done

      - name: Escape MDX-special characters outside code regions
        # Mintlify parses .md as MDX. Literal `{ ... }` in prose is
        # interpreted as a JSX expression and trips the broken-links
        # check; literal `<` followed by `=`, digits, or whitespace
        # makes the parser look for a tag name and bail with
        # `Unexpected character ... before name`.
        #
        # CommonMark inline code: a span opens with N consecutive
        # backticks and closes with the same number. The earlier
        # implementation toggled state on every single backtick,
        # which mishandled spans like ``code with ` inside`` (used
        # to embed a literal backtick) — the inner backtick flipped
        # state mid-span and the closing pair landed wrong. The
        # walker below counts the opening run, scans ahead for a
        # matching-length closing run, and copies the entire span
        # verbatim. Triple-backtick fences are still detected at
        # line level above the per-character loop.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            awk '
              BEGIN { in_fence = 0 }
              /^```/ { in_fence = !in_fence; print; next }
              {
                if (in_fence) { print; next }
                s = $0
                out = ""
                n = length(s)
                i = 1
                while (i <= n) {
                  c = substr(s, i, 1)
                  if (c == "`") {
                    runlen = 0
                    while (i + runlen <= n && substr(s, i + runlen, 1) == "`") runlen++
                    j = i + runlen
                    close_at = 0
                    while (j <= n) {
                      if (substr(s, j, 1) == "`") {
                        k = 0
                        while (j + k <= n && substr(s, j + k, 1) == "`") k++
                        if (k == runlen) { close_at = j; break }
                        j += k
                      } else {
                        j++
                      }
                    }
                    if (close_at > 0) {
                      end = close_at + runlen - 1
                      out = out substr(s, i, end - i + 1)
                      i = end + 1
                    } else {
                      out = out substr(s, i, runlen)
                      i += runlen
                    }
                  } else if (c == "{") {
                    out = out "&#123;"; i++
                  } else if (c == "}") {
                    out = out "&#125;"; i++
                  } else if (c == "<") {
                    # MDX treats `<` as the start of a JSX tag.
                    # Pydoc-markdown sometimes emits inequalities
                    # like `confidence <= 0.85` directly in prose,
                    # which the parser rejects with
                    #   Unexpected character `=` ... before name.
                    # Escape any `<` not immediately followed by a
                    # tag-name character (letter, `!`, `/`).
                    next_c = (i + 1 <= n) ? substr(s, i + 1, 1) : ""
                    if (next_c ~ /[A-Za-z!\/]/) {
                      out = out c; i++
                    } else {
                      out = out "&lt;"; i++
                    }
                  } else {
                    out = out c; i++
                  }
                }
                print out
              }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Cross-link package overview re-export stubs
        # pydoc-markdown emits an empty `## ClassName` heading on each
        # `<package>/overview.md` for every name re-exported from the
        # package's `__init__.py`. The actual class/function bodies
        # live on submodule pages (e.g. `models.md`, `tools.md`), so
        # the overview's right-side TOC entries lead to dead-end
        # in-page anchors with no content.
        #
        # Replace the empty stub block with a clean `## API` section
        # listing each symbol as a link to where it's actually
        # defined. Mapping is built by scanning every non-overview
        # page for canonical definitions:
        #   `## ClassName Objects` (h2 + " Objects" suffix)  -> class
        #   `#### function_name` (h4)                        -> function
        # Other heading shapes (h2 without "Objects", h3) are skipped
        # because pydoc-markdown reuses them for re-export stubs and
        # for class-internal sections respectively.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          python3 - <<'PYINNER'
          import pathlib
          import re

          root = pathlib.Path(".")

          def slugify(text: str) -> str:
              s = text.lower().replace("\\_", "_").replace("\\", "")
              s = re.sub(r"[^a-z0-9_\s-]", "", s)
              s = re.sub(r"\s+", "-", s.strip())
              return s

          heading_re = re.compile(
              r'<a id="([^"]+)"></a>\n+(#{2,6})\s+([^\n]+?)\n'
          )

          symbol_map: dict[tuple[str, str], tuple[str, str]] = {}
          for md in root.rglob("*.md"):
              if md.name in ("overview.md", "README.md"):
                  continue
              rel = md.relative_to(root).with_suffix("").as_posix()
              text = md.read_text(encoding="utf-8")
              for m in heading_re.finditer(text):
                  full_id = m.group(1)
                  level = len(m.group(2))
                  heading = m.group(3).strip()
                  parts = full_id.split(".")
                  if len(parts) < 3:
                      continue
                  parent = parts[-2]
                  # Class members (e.g. `Class.method`) sit under an
                  # uppercase parent — those are not standalone
                  # symbols and shouldn't be link targets here.
                  if parent and parent[0].isupper():
                      continue
                  is_class_def = level == 2 and heading.endswith(" Objects")
                  is_func_def = level == 4
                  if not (is_class_def or is_func_def):
                      continue
                  key = (parts[0], parts[-1])
                  symbol_map.setdefault(key, (rel, slugify(heading)))

          # An empty stub is `<a id="pkg.Name"></a>\n\n## Name\n`
          # followed by another anchor or end-of-file (no body
          # in between).
          stub_re = re.compile(
              r'<a id="(?P<id>[^"]+)"></a>\n+##\s+(?P<heading>[^\n]+?)\n'
              r'(?=\n<a id="|\s*\Z)'
          )

          rewritten = 0
          for overview in root.rglob("overview.md"):
              text = overview.read_text(encoding="utf-8")
              stubs = list(stub_re.finditer(text))
              if not stubs:
                  continue
              pre = text[: stubs[0].start()].rstrip() + "\n\n"
              overview_dir = overview.parent.relative_to(root).as_posix()
              api_lines: list[str] = []
              for stub in stubs:
                  full_id = stub.group("id")
                  parts = full_id.split(".")
                  if len(parts) != 2:
                      continue
                  package, name = parts
                  target = symbol_map.get((package, name))
                  if target:
                      target_rel, slug = target
                      if target_rel.startswith(overview_dir + "/"):
                          target_rel = target_rel[len(overview_dir) + 1:]
                      # Plain `[name](url)` (no backticks) so Mintlify
                      # applies its standard link styling. The earlier
                      # `[`name`](url)` form wrapped the text in a
                      # <code> element whose background made the link
                      # visually indistinguishable from non-clickable
                      # code spans elsewhere on the page.
                      api_lines.append(
                          f"- [{name}](./{target_rel}#{slug})"
                      )
                  else:
                      # Symbol re-exported from `__init__.py` but not
                      # documented anywhere (e.g. typing helpers).
                      # Keep the code-style for unlinked entries so
                      # the missing-target case is visually distinct.
                      api_lines.append(f"- `{name}`")
              if not api_lines:
                  continue
              new_text = pre + "## API\n\n" + "\n".join(api_lines) + "\n"
              overview.write_text(new_text, encoding="utf-8")
              rewritten += 1
          print(f"  rewrote {rewritten} package overview pages")
          PYINNER

      - name: Build pages index
        # Flat JSON array of generated Markdown paths (without
        # extension) so the docs repo can later splice them into
        # docs.json automatically.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -name '*.md' -type f \
            | sed 's|^\./||; s|\.md$||' \
            | sort > _pages.txt
          jq -R -s 'split("\n") | map(select(length > 0))' _pages.txt > _pages.json
          rm _pages.txt

      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: resq-software/docs
          path: docs-checkout
          token: ${{ secrets.DOCS_REPO_PR_TOKEN }}
          persist-credentials: false

      - name: Sync generated Markdown into docs checkout
        run: |
          target="docs-checkout/${DOCS_TARGET}"
          mkdir -p "$target"
          rm -rf "${target:?}"/*
          cp -R "${OUTPUT_DIR}/." "$target/"

      - name: Splice _pages.json into docs.json nav
        # Mintlify only routes pages registered in docs.json. The
        # _pages.json artifact lists every generated Markdown path;
        # rewrite the matching language sub-group under the
        # 'Generated Package References' group so all pages are
        # discoverable, in-content cross-links resolve, and direct
        # URLs work.
        working-directory: docs-checkout
        run: |
          python3 - <<'PYINNER'
          import json
          import pathlib

          PREFIX = "sdks/python/api"
          LANG_LABEL = "Python"

          docs_path = pathlib.Path("docs.json")
          docs = json.loads(docs_path.read_text())
          pages_path = pathlib.Path(PREFIX) / "_pages.json"
          if not pages_path.exists():
              raise SystemExit(f"missing {pages_path}")
          raw = json.loads(pages_path.read_text())

          # Build hierarchical groups by path segments. Each
          # `<dir>/README` becomes the dir's group entry rather than
          # a duplicate leaf.
          tree: dict = {}

          def insert(node, parts, full_id):
              if len(parts) == 1:
                  node.setdefault("_files", []).append((parts[0], full_id))
                  return
              head, *rest = parts
              insert(node.setdefault("_dirs", {}).setdefault(head, {}), rest, full_id)

          for p in raw:
              if p == "README":
                  continue
              # Mintlify auto-redirects `/path/README` to `/path`, so
              # register the directory form (page id without trailing
              # /README). Files that don't end in /README keep their
              # path verbatim.
              if p.endswith("/README"):
                  full_id = f"{PREFIX}/{p[: -len('/README')]}"
                  parts = full_id[len(PREFIX) + 1:].split("/")
              else:
                  full_id = f"{PREFIX}/{p}"
                  parts = p.split("/")
              insert(tree, parts, full_id)

          def to_mintlify(node, group_name):
              pages = []
              for fname, full_id in sorted(node.get("_files", [])):
                  pages.append(full_id)
              for dname, sub in sorted(node.get("_dirs", {}).items()):
                  pages.append(to_mintlify(sub, dname))
              return pages if group_name is None else {"group": group_name, "pages": pages}

          new_pages = [f"{PREFIX}/README"] + to_mintlify(tree, None)

          en = next(l for l in docs["navigation"]["languages"] if l["language"] == "en")
          sdks_tab = next(t for t in en["tabs"] if t["tab"] == "SDKs")
          gen_group = next(g for g in sdks_tab["groups"] if g["group"] == "Generated Package References")
          for sub in gen_group["pages"]:
              if isinstance(sub, dict) and sub.get("group") == LANG_LABEL:
                  sub["pages"] = new_pages
                  break
          else:
              gen_group["pages"].append({"group": LANG_LABEL, "pages": new_pages})

          docs_path.write_text(json.dumps(docs, indent=2, ensure_ascii=False))
          print(f"Updated {LANG_LABEL} sub-group with {len(raw)} pages")
          PYINNER

      - name: Open PR in docs repo
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: docs-checkout
          token: ${{ secrets.DOCS_REPO_PR_TOKEN }}
          author: 'resq-sw <engineer@resq.software>'
          committer: 'resq-sw <engineer@resq.software>'
          commit-message: |
            docs(python): sync API reference for ${{ env.DOCS_REF_NAME }}
          title: 'docs(python): API reference ${{ env.DOCS_REF_NAME }}'
          body: |
            Auto-generated by `${{ github.workflow }}` in
            `${{ github.repository }}` for ref `${{ env.DOCS_REF_NAME }}`
            (run: ${{ github.run_id }}).

            Regenerated files under `sdks/python/api/`. Review the
            diff for unintended exports and merge to publish.
          branch: auto/python-api-${{ env.DOCS_REF_SLUG }}
          base: main
          delete-branch: true
          add-paths: |
            sdks/python/api/**
            docs.json
          labels: |
            automated
            docs:api-ref
            language:python
