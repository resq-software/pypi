[project]
name = "resq-mcp"
version = "1.3.3"
description = "FastMCP server exposing ResQ platform capabilities to AI clients"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "ResQ Team" }]
keywords = ["mcp", "drone", "disaster-response", "fastmcp", "resq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  # >=1.28.1: GHSA advisory on mcp itself. Also constrains starlette and
  # python-multipart, so raising this floor pulls both of those past their
  # own advisories for consumers resolving from PyPI rather than our lock.
  # <2 caps the SDK major. Redundant while a FastMCP 3.x is selected (3.x already
  # pins mcp<2), but load-bearing the moment FastMCP 4 ships stable.
  "mcp>=1.28.1,<3",
  # >=3.3 matches the locked 3.3.1 -- a freeze, not an upgrade. <4 is the
  # load-bearing cap: FastMCP 4 requires MCP SDK 2.x, so without it the next
  # stable major would silently drag the SDK across its own major boundary.
  "fastmcp>=3.3,<4",
  # >=3.14.3: GHSA-cq5v-8q36-5273 (OOB heap read in the C HTTP response
  # parser). The lockfile pins this for CI, but published-package consumers
  # resolve against this floor, so it has to exclude the vulnerable range.
  "aiohttp>=3.14.3",
  "pydantic>=2.0.0",
  # >=2.14.2: advisory fix.
  "pydantic-settings>=2.14.2",
  "uvicorn>=0.20.0",
  "fastapi>=0.115.0",
  "python-dotenv>=1.0.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp>=1.24.0",
]

[project.urls]
Repository = "https://github.com/resq-software/pypi"
Changelog = "https://github.com/resq-software/pypi/blob/main/packages/resq-mcp/CHANGELOG.md"
Issues = "https://github.com/resq-software/pypi/issues"

[project.scripts]
resq-mcp = "resq_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resq_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # Pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "UP",    # pyupgrade
  "ARG",   # flake8-unused-arguments
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "PTH",   # flake8-use-pathlib
  "RUF",   # Ruff-specific rules
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
]
ignore = [
  "S104",  # Possible binding to all interfaces (acceptable for dev server)
  "TC003", # Pydantic models need datetime at runtime, not just TYPE_CHECKING
]

[tool.ruff.lint.isort]
known-first-party = ["resq_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under=0 keeps local/partial runs from failing on the project-wide
# threshold; CI passes --cov-fail-under=85 to enforce it on the full suite.
addopts = ["-v", "--tb=short", "--strict-markers", "--cov=src", "--cov-fail-under=0"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
source = ["src/resq_mcp"]
branch = true

[tool.coverage.report]
# Applies only to a bare `coverage report`. The pytest path always passes an
# explicit --cov-fail-under (0 via addopts, 85 in CI), which overrides this.
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.interrogate]
# Every definition in src/ under the exclusions below is documented, so the
# gate is pinned at 100: new undocumented code fails CI rather than silently
# eroding coverage. Note that ignore-private below excludes dunder names only,
# not single-underscore helpers -- those need docstrings too.
fail-under = 100
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
exclude = ["tests", "build", "dist"]
verbose = 1
quiet = false
color = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "chore", "ci", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "build>=1.0.0",
  "twine>=5.0.0",
  "hypothesis>=6.100.0",
  "aioresponses>=0.7.6",
  "interrogate>=1.7.0",
]
