[project]
name = "resq-mcp"
version = "1.3.3"
description = "FastMCP server exposing ResQ platform capabilities to AI clients"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "ResQ Team" }]
keywords = ["mcp", "drone", "disaster-response", "fastmcp", "resq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  # >=1.28.1: GHSA advisory on mcp itself. Also constrains starlette and
  # python-multipart, so raising this floor pulls both of those past their
  # own advisories for consumers resolving from PyPI rather than our lock.
  # >=2.0 is required by FastMCP 4; <3 keeps the next SDK major an explicit
  # decision. Supersedes the old >=1.28.1 advisory floor (GHSA-vj7q-gjh5-988w
  # affects <1.28.1 only, so the 2.x line is clear).
  "mcp>=2.0,<3",
  # >=2.14.0: GHSA-w6j9-cwv2-h6wq / CVE-2026-102274 (malformed RSA JWK aborts JWK Set
  # parsing, CVSS 5.9). Transitive via mcp -> pyjwt[crypto] (unpinned, was resolving to
  # 2.13.0); floored here so PyPI consumers resolve past it. [crypto] keeps mcp's extra.
  "pyjwt[crypto]>=2.14.0",
  # >=4.0.3 adopts the 2026-07-28 protocol line deliberately rather than merely
  # permitting it; a >=3.3 floor would let a resolver fall back to 3.x and a
  # different negotiated protocol. <5 keeps the next major a decision.
  # >=4.1.2: GHSA-7xgj-8392-5q4r (CVSS 6.8) against 4.0.3, which also affects
  # fastmcp-slim. Raising this floor is what moves authlib and joserfc for a
  # consumer resolving from PyPI, since both arrive through fastmcp-slim.
  "fastmcp>=4.1.2,<5",
  # >=3.14.4: eight advisories against 3.14.3, highest CVSS 8.7
  # (GHSA-2g87-pp6c-29x5), superseding the earlier >=3.14.3 floor for
  # GHSA-cq5v-8q36-5273. The lockfile pins this for CI, but published-package
  # consumers resolve against this floor, so it has to exclude the whole
  # vulnerable range.
  "aiohttp>=3.14.4",
  "pydantic>=2.0.0",
  # >=2.14.2: advisory fix.
  "pydantic-settings>=2.14.2",
  "uvicorn>=0.20.0",
  "fastapi>=0.115.0",
  "python-dotenv>=1.0.0",
  # The four below are transitive, floored here for the same reason the pyjwt
  # floor exists: our lockfile protects CI, but anyone installing this package
  # from PyPI resolves against these declarations instead.
  # >=1.9.1: nine advisories against authlib 1.7.2, highest CVSS 9.1
  # (GHSA-6v38-4h7w-rj9h); GHSA-c73q-w75p-j82v needs 1.9.1 specifically.
  # Reached via fastmcp -> fastmcp-slim.
  "authlib>=1.9.1",
  # >=2026.10.18: PYSEC-2026-4320 (CVSS 9.1) against the 2026.7.22 CA bundle.
  # Reached via the HTTP stack; a stale trust store is not a transitive detail.
  "certifi>=2026.10.18",
  # >=2.9.0: advisory against dnspython 2.8.0 (CVSS 7.5). Reached via
  # email-validator.
  "dnspython>=2.9.0",
  # >=1.7.6: two advisories against joserfc 1.6.8, highest CVSS 7.5; the later
  # of the two needs 1.7.6. Reached via authlib and fastmcp-slim.
  "joserfc>=1.7.6",
  # >=1.45.1: advisory against opentelemetry-api 1.42.1 (CVSS 5.3). The api,
  # sdk and exporter are released in lockstep upstream and pin each other
  # exactly, so all three floors move together; raising only the api floor
  # leaves a resolution that cannot satisfy the sdk.
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp>=1.45.1",
]

[project.urls]
Repository = "https://github.com/resq-software/pypi"
Changelog = "https://github.com/resq-software/pypi/blob/main/packages/resq-mcp/CHANGELOG.md"
Issues = "https://github.com/resq-software/pypi/issues"

[project.scripts]
resq-mcp = "resq_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resq_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # Pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "UP",    # pyupgrade
  "ARG",   # flake8-unused-arguments
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "PTH",   # flake8-use-pathlib
  "RUF",   # Ruff-specific rules
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
]
ignore = [
  "S104",  # Possible binding to all interfaces (acceptable for dev server)
  "TC003", # Pydantic models need datetime at runtime, not just TYPE_CHECKING
]

[tool.ruff.lint.isort]
known-first-party = ["resq_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under=0 keeps local/partial runs from failing on the project-wide
# threshold; CI passes --cov-fail-under=85 to enforce it on the full suite.
addopts = ["-v", "--tb=short", "--strict-markers", "--cov=src", "--cov-fail-under=0"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
source = ["src/resq_mcp"]
branch = true

[tool.coverage.report]
# Applies only to a bare `coverage report`. The pytest path always passes an
# explicit --cov-fail-under (0 via addopts, 85 in CI), which overrides this.
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.interrogate]
# Every definition in src/ under the exclusions below is documented, so the
# gate is pinned at 100: new undocumented code fails CI rather than silently
# eroding coverage. Note that ignore-private below excludes dunder names only,
# not single-underscore helpers -- those need docstrings too.
fail-under = 100
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
exclude = ["tests", "build", "dist"]
verbose = 1
quiet = false
color = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "chore", "ci", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "build>=1.0.0",
  "twine>=5.0.0",
  "hypothesis>=6.100.0",
  "aioresponses>=0.7.6",
  "interrogate>=1.7.0",
]
