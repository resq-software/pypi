[project]
name = "resq-agent"
version = "0.1.0"
description = "LangGraph incident-response agent that drives resq-mcp"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "ResQ Team" }]
keywords = ["langgraph", "langchain", "mcp", "resq", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-mcp-adapters>=0.1.0",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]

[project.urls]
Repository = "https://github.com/resq-software/pypi"
Issues = "https://github.com/resq-software/pypi/issues"

[project.scripts]
resq-agent = "resq_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resq_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "ARG",
  "SIM",
  "TC",
  "PTH",
  "RUF",
  "ASYNC",
  "S",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["resq_agent"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002", "TC002"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers", "--cov=src", "--cov-fail-under=0"]

[tool.coverage.run]
source = ["src/resq_agent"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
exclude = ["tests", "build", "dist"]
verbose = 1
quiet = false
color = true

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "interrogate>=1.7.0",
]
